name: CameraControlTest
options:
  bundleIdPrefix: de.malte
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CameraControlTest:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malte.aperture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Aperture"
        INFOPLIST_KEY_NSCameraUsageDescription: "Aperture keeps the camera running without recording so the Camera Control button works as a game controller. Nothing is saved or sent."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        MARKETING_VERSION: "1.2.12"
        CURRENT_PROJECT_VERSION: "21"
