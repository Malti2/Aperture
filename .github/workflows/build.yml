name: Build
on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Also build the simulator screenshots
        type: boolean
        default: true
  push:
    branches: [main, 'claude/**']
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild -project Aperture.xcodeproj -scheme Aperture \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Aperture.app Payload/
          zip -qr Aperture.ipa Payload
      # Uploaded as the plain .ipa, not wrapped in a zip. The artifact is named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: Aperture.ipa
          archive: false
          retention-days: 7
  screenshot:
    # Slow, so branch pushes skip it unless the commit message has [screenshots].
    # main always runs it because the release job needs it.
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.screenshots) ||
      contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild -project Aperture.xcodeproj -scheme Aperture \
            -configuration Debug -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Screenshots
        run: |
          DEV=$(xcrun simctl list devices available | grep -m1 "iPhone 17 (" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -n "$DEV" ] || DEV=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/Aperture.app
          xcrun simctl launch "$DEV" de.malte.aperture -demo
          sleep 6
          xcrun simctl io "$DEV" screenshot screenshot-menu.png
          xcrun simctl terminate "$DEV" de.malte.aperture
          xcrun simctl launch "$DEV" de.malte.aperture -demo -settings
          sleep 6
          xcrun simctl io "$DEV" screenshot screenshot-settings.png
          xcrun simctl terminate "$DEV" de.malte.aperture
          xcrun simctl launch "$DEV" de.malte.aperture -demo -paused
          sleep 6
          xcrun simctl io "$DEV" screenshot screenshot-paused.png
          xcrun simctl terminate "$DEV" de.malte.aperture
          xcrun simctl launch "$DEV" de.malte.aperture -demo -shop
          sleep 6
          xcrun simctl io "$DEV" screenshot screenshot-shop.png
          xcrun simctl terminate "$DEV" de.malte.aperture
          xcrun simctl io "$DEV" recordVideo --codec h264 --force shop-motion.mp4 &
          REC=$!
          sleep 2
          xcrun simctl launch "$DEV" de.malte.aperture -demo -shop -cycle
          sleep 16
          kill -INT $REC
          wait $REC || true
          xcrun simctl terminate "$DEV" de.malte.aperture
          xcrun simctl launch "$DEV" de.malte.aperture -demo -autoplay
          sleep 9
          xcrun simctl io "$DEV" screenshot screenshot-game.png
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: |
            screenshot-*.png
            shop-motion.mp4
          retention-days: 1
  release:
    # Only main publishes a draft release; other branches just keep the artifacts.
    if: github.ref == 'refs/heads/main'
    needs: [ipa, screenshot]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA=$(find out -name Aperture.ipa -type f | head -n 1)
          [ -n "$IPA" ] || { echo "Aperture.ipa not found"; find out; exit 1; }
          VERSION=$(unzip -p "$IPA" 'Payload/*.app/Info.plist' | python3 -c "import plistlib,sys; print(plistlib.loads(sys.stdin.buffer.read())['CFBundleShortVersionString'])")
          TAG="v$VERSION"
          echo "Build version $VERSION, tag $TAG"
          # Never touch a release that is already public, whatever its version.
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG\" and .draft==false) | .id")
          if [ -n "$published" ]; then
            echo "$TAG is already published, leaving it alone"
            exit 0
          fi
          # Only an unpublished draft with this tag is replaced.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG\" and .draft==true) | .id" | while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target main \
            --title "Aperture $VERSION (unsigned)" \
            --notes "Unsigned IPA. Sign and install it yourself." \
            "$IPA"
