name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild -project CameraControlTest.xcodeproj -scheme CameraControlTest \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CameraControlTest.app Payload/
          zip -qr CameraControlTest.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CameraControlTest-ipa
          path: CameraControlTest.ipa
          retention-days: 1
  screenshot:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild -project CameraControlTest.xcodeproj -scheme CameraControlTest \
            -configuration Debug -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Screenshots
        run: |
          DEV=$(xcrun simctl list devices available | grep -m1 "iPhone 17 (" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -n "$DEV" ] || DEV=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/CameraControlTest.app
          xcrun simctl launch "$DEV" de.malte.cameracontroltest -demo
          sleep 6
          xcrun simctl io "$DEV" screenshot screenshot-menu.png
          xcrun simctl terminate "$DEV" de.malte.cameracontroltest
          xcrun simctl launch "$DEV" de.malte.cameracontroltest -demo -settings
          sleep 6
          xcrun simctl io "$DEV" screenshot screenshot-settings.png
          xcrun simctl terminate "$DEV" de.malte.cameracontroltest
          xcrun simctl launch "$DEV" de.malte.cameracontroltest -demo -paused
          sleep 6
          xcrun simctl io "$DEV" screenshot screenshot-paused.png
          xcrun simctl terminate "$DEV" de.malte.cameracontroltest
          xcrun simctl launch "$DEV" de.malte.cameracontroltest -demo -autoplay
          sleep 9
          xcrun simctl io "$DEV" screenshot screenshot-game.png
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshot-*.png
          retention-days: 1
  release:
    needs: [ipa, screenshot]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.1.3 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create v1.1.3 --repo "$GITHUB_REPOSITORY" --draft --target main \
            --title "Aperture 1.1.3 (unsigned)" \
            --notes "Unsigned IPA. Sign and install it yourself." \
            out/CameraControlTest-ipa/CameraControlTest.ipa out/simulator-screenshots/screenshot-menu.png out/simulator-screenshots/screenshot-game.png out/simulator-screenshots/screenshot-settings.png out/simulator-screenshots/screenshot-paused.png
